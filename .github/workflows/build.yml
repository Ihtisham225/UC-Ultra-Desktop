name: Build & Release

on:
  push:
    tags:
      - 'v*'          # trigger on version tags e.g. v1.0.0
  workflow_dispatch:  # allow manual trigger from GitHub UI

# Each platform job uploads straight to the GitHub Release instead of
# staging through Actions artifact storage (which is capped at 0.5GB on
# the free plan and fills up fast with 100MB+ installers).
permissions:
  contents: write

jobs:
  # GitHub retired hosted Intel macOS runners, so we build both architectures
  # on the Apple Silicon runner. electron-builder cross-packages x64 fine
  # since this app has no native/compiled Node modules.
  build-mac:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps

      # The tag is what's being released, so it decides the version — see
      # .github/scripts/version-from-tag.mjs. Must run before the build, since
      # electron-builder reads package.json when it packages and writes the
      # update manifests.
      - name: Take the version from the tag
        run: node .github/scripts/version-from-tag.mjs

      # electron-builder's auto-notarization expects APPLE_API_KEY to be a
      # file path, not raw content — materialize the secret into a file.
      - name: Write App Store Connect API key to file
        run: echo "${{ secrets.APPLE_API_KEY }}" > apple_api_key.p8

      # ⚠️ The signing keychain is built here rather than left to
      # electron-builder, and this is why:
      #
      # app-builder-lib 24.x creates its temp keychain with a random password,
      # then hands `security set-key-partition-list` the CERTIFICATE's password
      # (CSC_KEY_PASSWORD) where the KEYCHAIN's belongs. The wrong value is
      # harmless while that keychain is still unlocked, and fatal the moment it
      # isn't — `SecKeychainUnlock: the passphrase you entered is not correct`.
      # Runner image 20260831.0337 leaves it locked by then where 20260728.0273
      # did not, and `macos-latest` hands out whichever image it likes, so the
      # same commit and secrets passed or failed at random (8/8 either way).
      #
      # macPackager only calls that code when CSC_LINK is set, so preparing the
      # keychain here and passing CSC_KEYCHAIN below skips it entirely. Setting
      # CSC_KEY_PASSWORD would NOT have fixed it — the certificate's password
      # still isn't the keychain's.
      - name: Prepare the signing keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # A long timeout, so it cannot lock mid-build — being locked at the
          # wrong moment is the whole failure this step exists to avoid.
          security set-keychain-settings -t 21600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -P is the certificate's password, empty as it has always been here;
          # this line is exactly what electron-builder already does today.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          # -k is the KEYCHAIN's password. Passing the certificate's here is
          # the upstream bug; keep these two straight.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign ignores keychains that aren't on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)

          rm -f "$RUNNER_TEMP/cert.p12"
          # Informational: the identity electron-builder will pick up. Not a
          # gate — let the build be the judge rather than guess at its rules.
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign & notarize (arm64 + x64)
        run: npm run build && npx electron-builder --mac --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # ⚠️ CSC_LINK and CSC_KEY_PASSWORD are deliberately NOT set: their
          # presence is what sends electron-builder down the broken path above.
          # CSC_KEYCHAIN arrives from the step's GITHUB_ENV.
          APPLE_API_KEY: ${{ github.workspace }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Remove API key file
        if: always()
        run: rm -f apple_api_key.p8

      # delete-keychain also drops it from the search list.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Publish macOS installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest-mac.yml is what electron-updater polls to discover new
          # versions — without it installed apps never see the update.
          # Blockmaps enable differential (delta) downloads.
          shopt -s nullglob
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber

  build-win:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The tag is what's being released, so it decides the version — see
      # .github/scripts/version-from-tag.mjs. Must run before the build, since
      # electron-builder reads package.json when it packages and writes the
      # update manifests.
      - name: Take the version from the tag
        run: node .github/scripts/version-from-tag.mjs

      - name: Build & package (Windows)
        shell: bash
        # Code signing. An absent secret still arrives as an EMPTY string, and
        # electron-builder treats a defined-but-empty WIN_CSC_LINK as a path to
        # resolve — "cannot resolve: D:\a\... not a file" — so the variables
        # have to be left undefined rather than set empty.
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "Signing certificate found — the installer will be signed."
            export WIN_CSC_LINK="$CERT_B64"
            export WIN_CSC_KEY_PASSWORD="$CERT_PASSWORD"
          else
            echo "No signing certificate — building unsigned (SmartScreen will warn)."
          fi
          npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Held under different names so they are never exported empty.
          CERT_B64: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Publish Windows installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest.yml is what electron-updater polls on Windows — required
          # for installed apps to discover new versions.
          shopt -s nullglob
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release/*.exe release/*.blockmap release/latest.yml --clobber
